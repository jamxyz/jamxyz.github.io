<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>jmclare.com</title>

<style>

body {
font-family: Arial, Helvetica, sans-serif;
margin: 0;
padding: 0;
color: #333;
background: #fafafa;
    }

/* Two-column page shell: animation on the left, content on the right */

.page {
display: flex;
align-items: stretch;
gap: 40px;
max-width: 900px;
margin: 60px auto;
padding: 0 30px;
    }

.helix-col {
flex: 0 0 200px;
height: 640px;
    }

#helix-wireframe-mount {
width: 100%;
height: 100%;
    }

.content-col {
flex: 1;
min-width: 0;
padding-top: 4px;
    }

h1 {
font-size: 1.1rem;
margin: 0 0 35px 0;
padding-bottom: 35px;
border-bottom: 1px solid #ddd;
    }

/* Each website/link */

.site {
display: flex;
align-items: center;
gap: 20px;
margin: 30px 0;
    }

/* Thumbnail */

.site img {
width: 100px;
height: 100px;
object-fit: cover;
border-radius: 4px;
flex-shrink: 0;
    }

/* Link */

.site a {
font-size: 0.9rem;
font-weight: bold;
color: #333;
text-decoration: none;
    }

.site a:hover {
color: #0066cc;
    }

/* Stack vertically on narrow/phone screens — the helix column becomes a
   shorter horizontal strip above the content rather than squeezing both
   columns side by side on a small viewport. */

@media (max-width: 680px) {
.page {
flex-direction: column;
margin: 30px auto;
gap: 20px;
    }

.helix-col {
flex: none;
width: 100%;
height: 320px;
    }
}

</style>

</head>

<body>

<div class="page">

<div class="helix-col">
<div id="helix-wireframe-mount"></div>
</div>

<div class="content-col">

<h1>jmclare.com</h1>


<!-- BLOG -->

<div class="site">

<img src="https://jmclare.com/images/jmclarebloglogo1.png"
alt="jmclare.blog">

<a href="https://jmclare.blog">
      jmclare.blog
</a>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/helix-wireframe.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    HelixWireframe.init("helix-wireframe-mount");
  });
</script>

</body>
</html>
