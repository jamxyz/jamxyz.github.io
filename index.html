<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>jmclare.com</title>

  <style>

    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 30px;
      color: #333;
      background: #fafafa;
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 35px 0;
      padding-bottom: 35px;
      border-bottom: 1px solid #ddd;
    }

    /* Each website/link */

    .site {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 30px 0;
    }

    /* Thumbnail */

    .site img {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* Link */

    .site a {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }

    .site a:hover {
      color: #0066cc;
    }

  </style>

</head>

<body>

  <h1>jmclare.com</h1>


  <!-- BLOG -->

  <div class="site">

    <img src="https://jmclare.com/images/jmclarebloglogo1.png"
         alt="jmclare.blog">

    <a href="https://jmclare.blog">
      jmclare.blog
    </a>

  </div>




</body>
</html>
