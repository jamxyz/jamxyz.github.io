<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>jmclare.com</title>

<style>

body {
font-family: Arial, Helvetica, sans-serif;
margin: 0;
padding: 0;
color: #333;
background: #fafafa;
}

/* Two-column page shell */

.page {
display: flex;
align-items: stretch;
gap: 40px;
max-width: 900px;
margin: 60px auto;
padding: 0 30px;
}

.helix-col {
flex: 0 0 200px;
height: 640px;
}

#helix-wireframe-mount {
width: 100%;
height: 100%;
}

.content-col {
flex: 1;
min-width: 0;
padding-top: 4px;
}

h1 {
font-size: 1.1rem;
margin: 0 0 35px 0;
padding-bottom: 35px;
border-bottom: 1px solid #ddd;
}

/* Each website/link */

.site {
display: flex;
align-items: center;
gap: 20px;
margin: 30px 0;
cursor: pointer;
}

/* Thumbnail */

.site img {
width: 100px;
height: 100px;
object-fit: cover;
border-radius: 4px;
flex-shrink: 0;
}

/* Link */

.site a,
.contact-trigger {
font-size: 0.9rem;
font-weight: bold;
color: #333;
text-decoration: none;
}

.site a:hover,
.contact-trigger:hover {
color: #0066cc;
}


/* =========================
   CONTACT PANEL
   ========================= */

.contact-panel {
max-height: 0;
overflow: hidden;
opacity: 0;
transition:
max-height 0.5s ease,
opacity 0.3s ease,
margin 0.5s ease;
margin-top: 0;
}

.contact-panel.open {
max-height: 500px;
opacity: 1;
margin-top: 20px;
}

.contact-inner {
border-top: 1px solid #ddd;
padding-top: 25px;
padding-bottom: 10px;
}

.contact-inner label {
display: block;
font-size: 0.8rem;
margin-bottom: 7px;
}

.contact-inner input,
.contact-inner textarea {
box-sizing: border-box;
width: 100%;
font-family: Arial, Helvetica, sans-serif;
font-size: 0.9rem;
padding: 10px;
border: 1px solid #ccc;
border-radius: 3px;
background: white;
margin-bottom: 18px;
}

.contact-inner textarea {
resize: vertical;
}

.contact-inner input:focus,
.contact-inner textarea:focus {
outline: none;
border-color: #999;
}

.contact-inner button {
font-family: Arial, Helvetica, sans-serif;
font-size: 0.8rem;
font-weight: bold;
padding: 9px 18px;
border: 1px solid #ccc;
border-radius: 3px;
background: white;
color: #333;
cursor: pointer;
}

.contact-inner button:hover {
background: #f0f0f0;
}

.contact-close {
font-size: 0.75rem;
color: #777;
text-decoration: none;
margin-left: 15px;
cursor: pointer;
}

.contact-close:hover {
color: #0066cc;
}


/* Success message */

.contact-success {
display: none;
font-size: 0.9rem;
padding: 20px 0;
}

.contact-success.show {
display: block;
}


/* Mobile */

@media (max-width: 680px) {

.page {
flex-direction: column;
margin: 30px auto;
gap: 20px;
}

.helix-col {
flex: none;
width: 100%;
height: 320px;
}

}

</style>

</head>

<body>

<div class="page">

<div class="helix-col">
<div id="helix-wireframe-mount"></div>
</div>


<div class="content-col">

<h1>jmclare.com</h1>


<!-- BLOG -->

<div class="site">

<img src="https://jmclare.com/images/jmclarebloglogo1.png"
alt="jmclare.blog">

<a href="https://jmclare.blog">
jmclare.blog
</a>

</div>


<!-- CONTACT -->

<div class="site" id="contact-trigger">

<img src="https://jmclare.com/images/jmclarebloglogo1.png"
alt="Contact me">

<span class="contact-trigger">
Contact me
</span>

</div>


<!-- CONTACT FORM -->

<div class="contact-panel" id="contact-panel">

<div class="contact-inner">

<form id="contact-form"
action="https://formspree.io/f/mbgrbqyp"
method="POST">

<label for="email">Your email:</label>

<input
type="email"
id="email"
name="email"
required
>


<label for="message">Your message:</label>

<textarea
id="message"
name="message"
rows="6"
required
></textarea>


<button type="submit">
Send
</button>

<a class="contact-close" id="contact-close">
Close
</a>

</form>


<div class="contact-success" id="contact-success">

Thanks — your message has been sent.

</div>

</div>

</div>


</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="js/helix-wireframe.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

  HelixWireframe.init("helix-wireframe-mount");


  const trigger = document.getElementById("contact-trigger");
  const panel = document.getElementById("contact-panel");
  const close = document.getElementById("contact-close");
  const form = document.getElementById("contact-form");
  const success = document.getElementById("contact-success");


  /* Open contact panel */

  trigger.addEventListener("click", function () {

    panel.classList.add("open");

  });


  /* Close contact panel */

  close.addEventListener("click", function (event) {

    event.preventDefault();

    panel.classList.remove("open");

  });


  /* Submit form without leaving the page */

  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const button = form.querySelector("button");

    button.disabled = true;
    button.textContent = "Sending...";


    try {

      const response = await fetch(form.action, {

        method: "POST",
        body: new FormData(form),
        headers: {
          "Accept": "application/json"
        }

      });


      if (response.ok) {

        form.style.display = "none";

        success.classList.add("show");

        setTimeout(function () {

          panel.classList.remove("open");

          setTimeout(function () {

            form.reset();

            form.style.display = "block";
            success.classList.remove("show");

            button.disabled = false;
            button.textContent = "Send";

          }, 500);

        }, 2000);


      } else {

        button.disabled = false;
        button.textContent = "Send";

        alert("Sorry, there was a problem sending your message.");

      }

    } catch (error) {

      button.disabled = false;
      button.textContent = "Send";

      alert("Sorry, there was a problem sending your message.");

    }

  });

});

</script>

</body>
</html>
