<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label {
      font-weight: bold;
    }
    input, textarea {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      padding: 12px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    button:hover {
      background: #004999;
    }
    .back-link {
      text-align: center;
      margin-top: 30px;
    }
    .back-link a {
      color: #0066cc;
      text-decoration: none;
      font-size: 1rem;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h1>Contact Me</h1>

<form action="https://formspree.io/f/mbgrbqyp" method="POST">
  <label>Your email:</label>
  <input type="email" name="email" required>

  <label>Your message:</label>
  <textarea name="message" rows="6" required></textarea>

  <button type="submit">Send</button>
</form>

<div class="back-link">
  <a href="index.html">← Back to Home</a>
</div>

</body>
</html>
